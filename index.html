<title>Majdoulin Güzellik Merkezi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@400;500;600;700&family=Lalezar&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout (white, black, pink accent): hero with a huge condensed two-colour headline beside a drawn hair-flow panel, a small salon photo and a round rating badge; three tall service cards; an accordion of services and times; a dark call-to-action band; a rounded booking panel; a salon strip with hours; chocolate footer. */
:root{
  --bg:#ffffff;
  --hero:#ffffff;
  --surface:#ffffff;
  --fg:#0d0d0d;
  --muted:#6b6b6b;
  --line:#e6e1e2;
  --band:#0d0d0d;
  --band-fg:#ffffff;
  --band-muted:#b9b4b5;
  --rose:#f4a9bd;
  --rose-soft:#fde3ea;
  --accent:#d3376f;
  --sel-bg:#0d0d0d;
  --sel-fg:#ffffff;
  --btnd:#0d0d0d;
  --btnd-fg:#ffffff;
  --ok:#1f7a4d;
  --warn:#a3361f;
  --f-display:"Anton","Impact","Arial Narrow",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0b0b;--hero:#0b0b0b;--surface:#161616;--fg:#f5f5f5;--muted:#a8a8a8;--line:#2c2c2c;--band:#171717;--rose-soft:#3a1f2a;--accent:#f48fb1;--sel-bg:#f4a9bd;--sel-fg:#0d0d0d;--btnd:#ffffff;--btnd-fg:#0d0d0d;--ok:#58c58f;--warn:#ff8a73;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0b;--hero:#0b0b0b;--surface:#161616;--fg:#f5f5f5;--muted:#a8a8a8;--line:#2c2c2c;--band:#171717;--rose-soft:#3a1f2a;--accent:#f48fb1;--sel-bg:#f4a9bd;--sel-fg:#0d0d0d;--btnd:#ffffff;--btnd-fg:#0d0d0d;--ok:#58c58f;--warn:#ff8a73;color-scheme:dark;
}
:root[lang="ar"]{--f-display:"Lalezar","Tajawal",sans-serif;--f-body:"Tajawal","Figtree",system-ui,sans-serif}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;padding-inline:16px}
.wrap{max-width:1120px;margin-inline:auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
:root:not([lang="ar"]) h1,:root:not([lang="ar"]) h2,:root:not([lang="ar"]) h3{text-transform:uppercase;letter-spacing:.01em}
h2{font-size:clamp(2.2rem,5vw,3.4rem);line-height:1}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--rose-soft);color:var(--fg);border-radius:999px;padding:5px 14px;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;width:fit-content}
:root[lang="ar"] .pill{letter-spacing:0;font-size:.92rem}
.pill::after{content:"✦";color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--rose);color:#0d0d0d;border:0;border-radius:999px;padding:13px 26px;font-weight:700;text-decoration:none;font-size:1rem;transition:filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn.dark{background:var(--btnd);color:var(--btnd-fg)}
.btn.line{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.arr{display:inline-block}
:root[dir="rtl"] .arr{transform:scaleX(-1)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:12px 16px}
.top .wrap{display:flex;align-items:center;gap:20px}
.brand{display:flex;flex-direction:column;text-decoration:none;margin-inline-end:auto;line-height:1;min-width:0}
.brand img{height:58px;width:auto;display:block;background:#0d0d0d;border-radius:14px;padding:4px 10px}
.brand b{font-family:var(--f-display);font-weight:400;font-size:1.6rem;letter-spacing:.04em}
:root:not([lang="ar"]) .brand img{height:58px;width:auto;display:block;background:#0d0d0d;border-radius:14px;padding:4px 10px}
.brand b{text-transform:uppercase}
.brand small{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:3px}
:root[lang="ar"] .brand small{letter-spacing:0;font-size:.8rem}
.nav{display:flex;gap:26px;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
:root[lang="ar"] .nav{letter-spacing:0;font-size:.95rem}
.nav a{text-decoration:none}
.nav a:hover{color:var(--accent)}
.langs{display:flex;gap:4px}
.langs button{background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.85rem;font-weight:700}
.langs button[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-fg)}
.top .btn{padding:9px 20px;font-size:.88rem}

/* hero */
.hero{background:var(--hero);margin-inline:-16px;padding:28px 16px 72px}
.hero .wrap{display:grid;grid-template-columns:1fr 1.05fr;gap:40px;align-items:center}
.hero .wrap > *{min-width:0}
.hero h1{font-size:clamp(3.4rem,10.5vw,7.4rem);line-height:.95;margin-block:20px 14px}
:root[lang="ar"] .hero h1{line-height:1.1;font-size:clamp(3.6rem,11vw,7.4rem)}
.hero h1 span,.hero h1 em{display:block;font-style:normal}
.hero h1 em{color:var(--accent)}
.tag{font-weight:600;letter-spacing:.16em;font-size:.88rem}
:root[lang="ar"] .tag{letter-spacing:0;font-size:1.05rem}
.hero .row{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px;align-items:center}
.state{display:flex;align-items:center;gap:8px;margin-top:22px;font-size:.92rem;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.dot.off{background:var(--warn)}
.visual{position:relative}
.visual .ph{aspect-ratio:4/5;border-radius:36px}
.visual .photo{z-index:2;position:absolute;inset-inline-start:-6%;bottom:7%;width:36%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:22px;border:5px solid var(--bg);box-shadow:0 14px 30px #0d0d0d33}
.badge{position:absolute;inset-inline-end:-14px;bottom:30px;width:122px;height:122px}
.badge svg{width:100%;height:100%;display:block}
@media (prefers-reduced-motion: no-preference){.badge .ring{transform-origin:60px 60px;animation:spin 30s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}

section{padding-block:64px}
.head{display:flex;flex-direction:column;gap:14px;margin-bottom:28px}

/* service cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/5;background:var(--band);color:#ffffff;display:flex;align-items:flex-end}
.card .ph{position:absolute;inset:0}
.card::after{z-index:1;content:"";position:absolute;inset:0;background:linear-gradient(to top,#000000cc 0%,#00000000 58%)}
.card .in{position:relative;z-index:2;padding:24px;display:flex;align-items:flex-end;gap:14px;width:100%}
.card .in > div{flex:1;min-width:0}
.card h3{font-size:clamp(2.6rem,5vw,3.8rem);line-height:.95}
.card p{font-size:.95rem;opacity:.92;margin-top:6px}
.go{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--rose);color:#0d0d0d;display:grid;place-items:center;font-weight:700;font-size:1.1rem}
.go:hover{filter:brightness(1.08)}

/* accordion */
.acc{margin-top:48px;border-bottom:1.5px solid var(--fg)}
details{border-top:1.5px solid var(--fg)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0;font-family:var(--f-display);font-size:1.5rem}
:root:not([lang="ar"]) summary{text-transform:uppercase}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--f-body);font-size:1.8rem;line-height:1;color:var(--accent)}
details[open] summary::after{content:"–"}
details ul{list-style:none;margin:0;padding:0 0 12px}
details li{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
details .nm{flex:1;min-width:0;font-weight:600}
details .du{color:var(--muted);font-size:.9rem;white-space:nowrap;font-variant-numeric:tabular-nums}
details .pick{background:var(--rose);color:#0d0d0d;border:0;border-radius:999px;padding:6px 16px;font-weight:700;font-size:.85rem}

/* cta band */
.cta{position:relative;border-radius:32px;overflow:hidden;background:#0d0d0d;color:#ffffff;min-height:260px;display:flex;align-items:center;justify-content:center;text-align:center;padding:48px 24px;margin-block:8px}
.cta .ph{position:absolute;inset:0}
.cta::after{z-index:1;content:"";position:absolute;inset:0;background:#0d0d0d88}
.cta .in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:34rem}
.cta h2{font-size:clamp(2.4rem,6vw,4.2rem)}
.cta p{opacity:.9}

/* booking */
.steps{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.steps li{display:flex;gap:14px;align-items:flex-start;border-top:1.5px solid var(--fg);padding-top:14px}
.steps b{font-family:var(--f-display);font-weight:400;font-size:2.6rem;line-height:1;color:var(--accent)}
.steps h3{font-size:1.25rem;line-height:1.1;margin-bottom:4px}
.steps p{color:var(--muted);font-size:.93rem}
.book{background:var(--surface);border:1px solid var(--line);border-radius:32px;padding:clamp(18px,4vw,40px);display:grid;grid-template-columns:1.5fr 1fr;gap:36px}
.book > *{min-width:0}
fieldset{border:0;margin:0 0 26px;padding:0;min-width:0}
legend{padding:0;margin-bottom:10px;font-weight:700;display:flex;gap:10px;align-items:baseline}
legend small{font-weight:400;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-size:.95rem}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-fg)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.day{flex:none;min-width:68px;border-radius:20px;display:flex;flex-direction:column;align-items:center;padding:8px 6px;scroll-snap-align:start;line-height:1.3}
.day b{font-size:1.3rem;font-variant-numeric:tabular-nums}
.day span{font-size:.78rem;opacity:.75}
.day:disabled{opacity:.4;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.slots .chip{font-variant-numeric:tabular-nums;text-align:center;padding-inline:6px}
.note{color:var(--muted);font-size:.95rem}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:700;font-size:.92rem}
.field input,.field textarea{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;width:100%}
.field input:focus,.field textarea:focus{outline:3px solid var(--rose);outline-offset:0;border-color:var(--rose)}
.sum{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);background:var(--band);color:#ffffff;border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:14px}
.sum h3{font-size:1.9rem;line-height:1}
.sum dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:.95rem}
.sum dt{color:var(--band-muted)}
.sum dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.sum dd.empty{color:var(--band-muted);font-weight:400}
.sum .btn{width:100%}
.sum .btn.line{color:#ffffff}
.hint{font-size:.88rem;color:#ffb3a3;min-height:1.4em}
.hint.ready{color:#8be0b4}
.fine{font-size:.85rem;color:var(--band-muted)}

/* salon strip */
.salon{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:36px;align-items:center}
.salon > *{min-width:0}
.salon .btn{margin-top:18px;width:fit-content}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:3/4;background:var(--band)}
.tile img,.tile .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tile span{position:absolute;inset-inline-start:8px;top:8px;background:var(--rose);color:#0d0d0d;border-radius:999px;padding:2px 10px;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
:root[lang="ar"] .tile span{letter-spacing:0;font-size:.8rem}
.hours{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:34px}
.hours th,.hours td{padding:13px 0;border-bottom:1px solid var(--line);text-align:start;font-weight:500}
.hours td{text-align:end}
.hours tr.today th,.hours tr.today td{color:var(--accent);font-weight:700}
.hoursbox{max-width:560px;margin-inline:auto}

/* footer */
.contact{background:var(--band);color:#ffffff;margin-inline:-16px;padding:56px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.contact .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:32px}
.contact h2{font-size:clamp(2.4rem,6vw,4rem)}
.contact address{font-style:normal;margin-top:14px;color:var(--band-muted)}
.tel{font-family:var(--f-display);font-size:2rem;direction:ltr;unicode-bidi:isolate;display:inline-block;margin-top:12px;user-select:all;color:var(--rose)}
.contact .btns{display:flex;flex-wrap:wrap;gap:10px;align-content:start}
.contact .btn.line{color:#ffffff}
.copy{grid-column:1/-1;color:var(--band-muted);font-size:.85rem;border-top:1px solid #ffffff22;padding-top:18px}

@media (max-width:860px){
  .hero .wrap,.book,.salon,.contact .wrap{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
  .card{aspect-ratio:5/4}
  .steps{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .nav{display:none}
  .sum{position:static}
  .visual{max-width:440px;margin-inline:auto;width:100%}
  .visual .photo{z-index:2;inset-inline-start:-4%}
  .badge{inset-inline-end:-6px;width:100px;height:100px}
}
@media (max-width:420px){
  .top .wrap{gap:8px}
  .top .btn{display:none}
}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}

  };

  var $ = function(id){return document.getElementById(id)};
  var lang = "ar";
  try{var sl = localStorage.getItem("mj_lang"); if(sl && T[sl]) lang = sl;}catch(e){}
  var st = {svc:null, date:null, time:null};

  function pad(n){return (n<10?"0":"")+n}
  function hm(min){return pad(Math.floor(min/60))+":"+pad(min%60)}
  function t(k){return T[lang][k]}
  function fmt(s,o){return s.replace(/\{(\w+)\}/g,function(_,k){return o[k]})}

  function istanbulNow(){
    var p = {};
    new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value});
    var h = parseInt(p.hour,10)%24;
    return {y:+p.year,m:+p.month,d:+p.day,min:h*60+parseInt(p.minute,10)};
  }
  function dayDate(base,i){return new Date(Date.UTC(base.y,base.m-1,base.d+i,12))}
  function key(d){return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate())}
  function fd(d,o){return new Intl.DateTimeFormat(T[lang].loc,Object.assign({timeZone:"UTC"},o)).format(d)}
  function svcById(id){for(var i=0;i<SERVICES.length;i++) if(SERVICES[i].id===id) return SERVICES[i]; return null}

  function slotsFor(date,dur,base){
    var h = HOURS[date.getUTCDay()], out = [], isToday = key(date)===key(dayDate(base,0));
    for(var m=h[0]; m+dur<=h[1]; m+=30){
      if(isToday && m < base.min+30) continue;
      out.push(m);
    }
    return out;
  }

  function renderStatic(){
    var L = T[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = L.dirAttr;
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"),function(el){
      var v = L[el.getAttribute("data-i18n")]; if(v!=null) el.textContent = v;
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-aria]"),function(el){
      el.setAttribute("aria-label", L[el.getAttribute("data-i18n-aria")]);
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-lang]"),function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-lang")===lang ? "true":"false");
    });
  }

  function renderOpen(){
    var base = istanbulNow(), d0 = dayDate(base,0), h = HOURS[d0.getUTCDay()];
    var open = base.min>=h[0] && base.min<h[1];
    $("dot").className = "dot"+(open?"":" off");
    if(open){ $("openNow").textContent = fmt(t("open"),{t:hm(h[1])}); return; }
    var di = base.min<h[0] ? 0 : 1, nd = dayDate(base,di), nh = HOURS[nd.getUTCDay()];
    var dayLabel = di===0 ? t("today") : t("tomorrow");
    $("openNow").textContent = fmt(t("closed"),{d:dayLabel,t:hm(nh[0])});
  }

  function renderServices(){
    var box = $("svcList"), openIdx = {};
    Array.prototype.forEach.call(box.querySelectorAll("details"),function(d,i){ openIdx[i] = d.open; });
    var firstRender = box.children.length===0;
    box.innerHTML = "";
    GROUPS.forEach(function(g,gi){
      var d = document.createElement("details");
      d.open = firstRender ? gi===0 : !!openIdx[gi];
      var sm = document.createElement("summary"); sm.textContent = g.t[lang]; d.appendChild(sm);
      var ul = document.createElement("ul");
      g.items.forEach(function(id){
        var s = svcById(id), li = document.createElement("li");
        li.innerHTML = '<span class="nm"></span><span class="du"></span><button type="button" class="pick"></button>';
        li.querySelector(".nm").textContent = s.n[lang];
        li.querySelector(".du").textContent = s.d+" "+t("min");
        var b = li.querySelector(".pick"); b.textContent = t("pick");
        b.addEventListener("click",function(){ pickService(s.id); $("book").scrollIntoView(); });
        ul.appendChild(li);
      });
      d.appendChild(ul); box.appendChild(d);
    });
    var c = $("svcChips"); c.innerHTML = "";
    SERVICES.forEach(function(s){
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = s.n[lang];
      b.setAttribute("aria-pressed", st.svc===s.id ? "true":"false");
      b.addEventListener("click",function(){ pickService(s.id); });
      c.appendChild(b);
    });
  }

  function renderDays(){
    var base = istanbulNow(), box = $("days"); box.innerHTML = "";
    var svc = svcById(st.svc), dur = svc ? svc.d : 30, first = null;
    for(var i=0;i<21;i++){
      var d = dayDate(base,i), k = key(d), has = slotsFor(d,dur,base).length>0;
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip day"; b.disabled = !has;
      b.innerHTML = '<span></span><b></b><span></span>';
      var sp = b.querySelectorAll("span");
      sp[0].textContent = i===0 ? t("today") : fd(d,{weekday:"short"});
      b.querySelector("b").textContent = d.getUTCDate();
      sp[1].textContent = fd(d,{month:"short"});
      b.setAttribute("aria-pressed", st.date===k ? "true":"false");
      (function(kk){ b.addEventListener("click",function(){ st.date = kk; st.time = null; renderDays(); renderSlots(); renderSummary(); }); })(k);
      if(has && !first) first = k;
      box.appendChild(b);
    }
    if(!st.date && first){ st.date = first; renderDays(); }
  }

  function dateObj(k){var p=k.split("-");return new Date(Date.UTC(+p[0],+p[1]-1,+p[2],12))}

  function renderSlots(){
    var box = $("slots"), base = istanbulNow(), svc = svcById(st.svc), dur = svc ? svc.d : 30;
    box.innerHTML = ""; $("noSlots").hidden = true;
    $("durNote").textContent = svc ? fmt(t("dur"),{m:svc.d}) : "";
    if(!st.date) return;
    var list = slotsFor(dateObj(st.date),dur,base);
    if(!list.length){ $("noSlots").hidden = false; $("noSlots").textContent = t("no_slots"); return; }
    if(st.time!==null && list.indexOf(st.time)<0) st.time = null;
    list.forEach(function(m){
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = hm(m);
      b.setAttribute("aria-pressed", st.time===m ? "true":"false");
      b.addEventListener("click",function(){ st.time = m; renderSlots(); renderSummary(); });
      box.appendChild(b);
    });
  }

  function validPhone(v){return v.replace(/\D/g,"").length>=10}
  function summaryLines(){
    var svc = svcById(st.svc);
    return {
      service: svc ? svc.n[lang] : "",
      date: st.date ? fd(dateObj(st.date),{weekday:"long",day:"numeric",month:"long"}) : "",
      time: st.time!==null ? hm(st.time) : "",
      name: $("fname").value.trim(),
      phone: $("fphone").value.trim(),
      note: $("fnote").value.trim()
    };
  }
  function messageText(){
    var s = summaryLines(), L = T[lang];
    var lines = [L.msg,"",L.ml_service+": "+s.service,L.ml_date+": "+s.date,L.ml_time+": "+s.time,L.ml_name+": "+s.name,L.ml_phone+": "+s.phone];
    if(s.note) lines.push(L.ml_note+": "+s.note);
    return lines.join("\n");
  }

  function renderSummary(){
    var s = summaryLines(), dl = $("sumList"); dl.innerHTML = "";
    [["s_service",s.service],["s_date",s.date],["s_time",s.time],["s_name",s.name],["s_phone",s.phone]].forEach(function(r){
      var dt = document.createElement("dt"), dd = document.createElement("dd");
      dt.textContent = t(r[0]); dd.textContent = r[1] || "—"; if(!r[1]) dd.className = "empty";
      dl.appendChild(dt); dl.appendChild(dd);
    });
    var missing = !s.service ? "need_service" : !s.date ? "need_date" : !s.time ? "need_time" : !s.name ? "need_name" : !validPhone(s.phone) ? "need_phone" : null;
    var btn = $("sendBtn"), hint = $("hint");
    if(missing){
      hint.textContent = t(missing); hint.className = "hint";
      btn.setAttribute("aria-disabled","true"); btn.setAttribute("href","#book");
    }else{
      hint.textContent = t("ready"); hint.className = "hint ready";
      btn.setAttribute("aria-disabled","false");
      btn.setAttribute("href","https://wa.me/"+PHONE_WA+"?text="+encodeURIComponent(messageText()));
    }
  }

  function pickService(id){ st.svc = id; renderServices(); renderDays(); renderSlots(); renderSummary(); }

  function renderHours(){
    var body = $("hoursBody"); body.innerHTML = "";
    var todayDow = dayDate(istanbulNow(),0).getUTCDay();
    [1,2,3,4,5,6,0].forEach(function(dw){
      var d = new Date(Date.UTC(2026,9,4+dw,12)); /* 4 Oct 2026 is a Sunday */
      var tr = document.createElement("tr"); if(dw===todayDow) tr.className = "today";
      var th = document.createElement("th"), td = document.createElement("td");
      th.scope = "row"; th.textContent = fd(d,{weekday:"long"});
      td.textContent = hm(HOURS[dw][0])+" – "+hm(HOURS[dw][1]);
      tr.appendChild(th); tr.appendChild(td); body.appendChild(tr);
    });
  }

  function renderAll(){
    renderStatic(); renderOpen(); renderServices(); renderDays(); renderSlots(); renderHours(); renderSummary();
  }

  Array.prototype.forEach.call(document.querySelectorAll("[data-lang]"),function(b){
    b.addEventListener("click",function(){
      lang = b.getAttribute("data-lang");
      try{localStorage.setItem("mj_lang",lang);}catch(e){}
      renderAll();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-go]"),function(b){
    b.addEventListener("click",function(){ pickService(b.getAttribute("data-go")); $("book").scrollIntoView(); });
  });
  ["fname","fphone","fnote"].forEach(function(id){
    $(id).addEventListener("input",function(){
      try{ if(id!=="fnote") localStorage.setItem("mj_"+id,$(id).value); }catch(e){}
      renderSummary();
    });
  });
  $("bookForm").addEventListener("submit",function(e){e.preventDefault()});
  $("copyBtn").addEventListener("click",function(){
    var txt = messageText(), b = $("copyBtn");
    function done(){ b.textContent = t("copied"); setTimeout(function(){ b.textContent = t("copy"); },1600); }
    try{ navigator.clipboard.writeText(txt).then(done,function(){}); }catch(e){}
  });
  $("sendBtn").addEventListener("click",function(e){ if(this.getAttribute("aria-disabled")==="true") e.preventDefault(); });

  try{ $("fname").value = localStorage.getItem("mj_fname")||""; $("fphone").value = localStorage.getItem("mj_fphone")||""; }catch(e){}
  renderAll();
  setInterval(renderOpen,60000);
})();
</script>
